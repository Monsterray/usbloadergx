name: Build binaries

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    paths-ignore:
      - '**.md'
      - '.devcontainer/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
      - '.github/**/*.md'
      - '.vscode/**'
      - 'HBC/**'
      - 'Languages/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - '.devcontainer/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
      - '.github/**/*.md'
      - '.vscode/**'
      - 'HBC/**'
      - 'Languages/**'

# A second push to the same branch makes the running build pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pure functions that handle data from a file, a drive or the network, compiled
  # from the exact sources the Wii build uses and run under ASan and UBSan. The
  # devkitPPC image has no host compiler, so this runs on the runner itself.
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run host tests
        run: sh tests/host/run.sh

  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:20250527
    # Steps in a container run with sh, which is dash in this image, and dash has no
    # pipefail: the compile step stopped at "set -o pipefail" with exit code 2.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Configure Git
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run static checks
        run: |
          for check in tests/*.sh; do
            echo "== $check"
            sh "$check" || exit 1
          done

      - name: Compile USB Loader GX
        run: |
          set -o pipefail
          make release -j$(nproc) 2>&1 | tee build.log

      - name: Check build output
        run: |
          ls -l boot.dol boot.elf
          test -s boot.dol

      - name: Check for compiler warnings
        run: |
          # The sources this project maintains compile clean. Third-party trees
          # are vendored as-is and are not held to that.
          warnings=$(grep 'warning:' build.log \
            | grep -v -E 'portlibs/|source/xml/pugi|source/libs/' || true)
          if [ -n "$warnings" ]; then
            echo "$warnings"
            echo "::error::the build emitted warnings in first-party sources"
            exit 1
          fi

      - name: Package
        if: ${{ vars.ALLOW_UPLOADS == 'true' }}
        run: |
          mkdir -p upload/apps/usbloader_gx
          cp boot.dol upload/apps/usbloader_gx
          cp HBC/icon.png upload/apps/usbloader_gx
          cp HBC/meta.xml upload/apps/usbloader_gx
          echo "sha=$(git rev-parse --short=7 HEAD)" >> $GITHUB_ENV

      - name: Upload binary
        if: ${{ vars.ALLOW_UPLOADS == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: usbloadergx_${{ env.sha }}
          path: upload

      - name: Upload debug binary
        if: ${{ vars.ALLOW_UPLOADS == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: usbloadergx_${{ env.sha }}_debug
          path: boot.elf
