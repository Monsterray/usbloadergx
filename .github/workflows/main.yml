name: Build binaries

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    paths-ignore:
      - '**.md'
      - '.devcontainer/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
      - '.github/**/*.md'
      - '.vscode/**'
      - 'HBC/**'
      - 'Languages/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - '.devcontainer/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
      - '.github/**/*.md'
      - '.vscode/**'
      - 'HBC/**'
      - 'Languages/**'

# A second push to the same branch makes the running build pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pure functions that handle data from a file, a drive or the network, compiled
  # from the exact sources the Wii build uses and run under ASan and UBSan. The
  # devkitPPC image has no host compiler, so this runs on the runner itself.
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run host tests
        run: sh tests/host/run.sh

  # The toolchain is the Dockerfile's toolchain stage: the devkitPPC image, the
  # packages it adds and the libraries deps/build.sh builds from source. CI builds
  # that stage and compiles in it, so it uses exactly what everyone else does.
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      # The whole history and the tags: makexml.sh takes the version shown in
      # the loader from the last vMAJOR.MINOR.PATCH tag (git describe).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run static checks
        run: |
          for check in tests/*.sh; do
            echo "== $check"
            sh "$check" || exit 1
          done

      - name: Build the toolchain image
        run: docker build --target toolchain -t usbloadergx-toolchain .

      - name: Compile USB Loader GX
        run: |
          set -o pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/w" -w /w usbloadergx-toolchain bash -c \
            'git config --global --add safe.directory /w && make release -j$(nproc)' 2>&1 | tee build.log

      - name: Check build output
        run: |
          ls -l boot.dol boot.elf
          test -s boot.dol
          sh scripts/check-dol.sh boot.dol

      - name: Check for compiler warnings
        run: |
          # The sources this project maintains compile clean. The third-party
          # code still kept in the tree (source/libs) is not held to that; the
          # libraries deps/build.sh builds are compiled with the toolchain image.
          warnings=$(grep 'warning:' build.log | grep -v 'source/libs/' || true)
          if [ -n "$warnings" ]; then
            echo "$warnings"
            echo "::error::the build emitted warnings in first-party sources"
            exit 1
          fi

      - name: Package
        if: ${{ vars.ALLOW_UPLOADS == 'true' }}
        run: |
          mkdir -p upload/apps/usbloader_gx
          cp boot.dol upload/apps/usbloader_gx
          cp HBC/icon.png upload/apps/usbloader_gx
          cp HBC/meta.xml upload/apps/usbloader_gx
          echo "sha=$(git rev-parse --short=7 HEAD)" >> $GITHUB_ENV

      - name: Upload binary
        if: ${{ vars.ALLOW_UPLOADS == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: usbloadergx_${{ env.sha }}
          path: upload

      - name: Upload debug binary
        if: ${{ vars.ALLOW_UPLOADS == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: usbloadergx_${{ env.sha }}_debug
          path: boot.elf
